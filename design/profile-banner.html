<!doctype html>
<!--
  Previous generated profile banner, kept for reference. Since 2026-10-12
  public/adhi-nugroho-banner.webp is the owner's own design
  (design/assets/profile-banner-source.webp). Render at 1600x900 (device
  scale 1) and export as WebP if this version is ever wanted again. The portrait cutout
  in design/assets/ was lifted from design/assets/adhi-nugroho.webp with Apple
  Vision's subject-lifting API (VNGenerateForegroundInstanceMaskRequest).

  Layout notes: on the profile page the round photo overlaps the banner's
  lower-left corner (about x 60-430, y 720-900 here), so nothing important
  sits there. The name is stacked on the left in two tones with only its
  last letter touching the hair; the note is a tag under it.
-->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
      }
      .banner {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background:
          radial-gradient(
            42% 62% at 64% 40%,
            rgb(255 255 255 / 0.22),
            transparent 70%
          ),
          linear-gradient(
            100deg,
            #17181b 0%,
            #26282c 34%,
            #5a5c61 72%,
            #8a8c91 100%
          );
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgb(255 255 255 / 0.14) 2px,
          transparent 2px
        );
        background-size: 36px 36px;
        -webkit-mask-image: linear-gradient(100deg, #000 0%, transparent 55%);
        mask-image: linear-gradient(100deg, #000 0%, transparent 55%);
      }
      .name {
        position: absolute;
        top: 92px;
        left: 92px;
        margin: 0;
        font-size: 196px;
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: #fff;
        white-space: nowrap;
      }
      .name span {
        display: block;
      }
      .name .soft {
        color: #9a9da3;
      }
      .portrait {
        position: absolute;
        left: 66%;
        bottom: -40px;
        width: 780px;
        height: 780px;
        transform: translateX(-50%);
        filter: grayscale(1) contrast(1.08) brightness(1.05);
      }
      .note {
        position: absolute;
        left: 96px;
        top: 486px;
        margin: 0;
        padding: 22px 34px 24px 30px;
        border-radius: 30px;
        background: #fff;
        color: #111318;
        font-size: 40px;
        line-height: 1.22;
        font-weight: 700;
        letter-spacing: -0.01em;
        box-shadow: 0 18px 40px -18px rgb(0 0 0 / 0.55);
      }
      .note .star {
        color: #1d4fd8;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="grid"></div>
      <p class="name"><span>Adhi</span><span class="soft">Nugroho</span></p>
      <img class="portrait" src="assets/portrait-cutout.webp" alt="" />
      <p class="note">
        <span class="star">*</span> bikin website &amp;<br />aplikasi web untuk
        usaha kamu
      </p>
    </div>
  </body>
</html>
